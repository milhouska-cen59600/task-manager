name: Check application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check committed Pages build
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error::Sestavení v docs neodpovídá zdrojům. Spusťte npm run build a commitněte docs."
            git status --short -- docs
            exit 1
          fi
